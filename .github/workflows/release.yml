name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Build
        run: uv build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true