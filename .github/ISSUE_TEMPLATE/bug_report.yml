name: Bug report
description: Report a bug in RepoSniffer
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can — the details
        (especially the exact query and JSON output) are what make a bug fixable.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `reposniffer --version` or `pip show reposniffer`, or the commit you're on."
      placeholder: "0.1.1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact query/command and any flags you used.
      placeholder: |
        reposniffer search "markdown editor with live preview" --top-k 5 --json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / logs
      description: Paste the output, including any error messages. Use `--json` if applicable.
      render: shell
  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit it?
      options:
        - CLI
        - MCP server (opencode / Claude Code / Codex / Cursor)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: env
    attributes:
      label: Environment
      options:
        - label: I set GITHUB_TOKEN (rate-limit-related issues often need it)
        - label: Local fastembed model (default) vs API embedder
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — cache files, OS, Python version.